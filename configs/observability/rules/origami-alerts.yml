# 中文：Origami 本地观测告警规则，覆盖 API 健康、质量门和延迟退化。
# English: Origami local observability alert rules covering API health, quality gates, and latency regressions.

groups:
  - name: origami-control-plane
    rules:
      - alert: OrigamiApiDown
        expr: up{job="origami-api"} == 0
        for: 1m
        labels:
          severity: critical
          service: origami-api
        annotations:
          summary: Origami API is not being scraped
          description: Prometheus has not been able to scrape the Origami API for more than 1 minute.

      - alert: OrigamiApiHigh5xxRate
        expr: sum(rate(origami_http_requests_total{status_code=~"5.."}[5m])) > 0
        for: 2m
        labels:
          severity: warning
          service: origami-api
        annotations:
          summary: Origami API is returning 5xx responses
          description: The API has returned server errors during the last 5 minutes.

      - alert: OrigamiApiHighP95Latency
        expr: histogram_quantile(0.95, sum by (le) (rate(origami_http_request_duration_seconds_bucket[5m]))) > 0.5
        for: 5m
        labels:
          severity: warning
          service: origami-api
        annotations:
          summary: Origami API p95 latency is high
          description: The API p95 latency has stayed above 500 ms for more than 5 minutes.

      - alert: OrigamiScenarioGateFailed
        expr: max(origami_run_quality_gate{run_type="scenario"}) == 0
        for: 1m
        labels:
          severity: critical
          service: origami-scenario
        annotations:
          summary: Scenario quality gate failed
          description: The latest scenario run reported a failed quality gate.

      - alert: OrigamiBenchmarkGateFailed
        expr: max(origami_run_quality_gate{run_type="benchmark"}) == 0
        for: 1m
        labels:
          severity: critical
          service: origami-benchmark
        annotations:
          summary: Benchmark quality gate failed
          description: The latest benchmark run reported a failed quality gate.

      - alert: OrigamiScenarioPassRateLow
        expr: min(origami_scenario_pass_rate) < 1
        for: 1m
        labels:
          severity: warning
          service: origami-scenario
        annotations:
          summary: Scenario pass rate dropped below 100%
          description: At least one scenario scope has a pass rate below 100%.

      - alert: OrigamiModuleP95High
        expr: max(origami_run_max_module_p95_ms) > 50
        for: 2m
        labels:
          severity: warning
          service: origami-pipeline
        annotations:
          summary: Module p95 latency exceeded threshold
          description: A latest scenario or benchmark run has max module p95 above 50 ms.
