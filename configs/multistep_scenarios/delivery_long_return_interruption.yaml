# 中文：长时间配送场景，模拟巡航耗电、低电返航以及返航途中遇到临时行人阻挡。
# English: Long-running delivery scenario covering cruise drain, low-battery return, and a temporary human block.

version: 1
id: delivery_long_return_interruption
name: Delivery Long Return Interruption Timeline
description: Robot cruises for several ticks, returns on low battery, pauses for a human, then resumes docking.
tags:
  - multistep
  - delivery
  - long_running
  - interruption
  - return_to_dock

time_step_s: 30
battery_drain_pct_per_step: 1.0

initial_observation:
  mission_type: carry_go_delivery
  position: [0, 0]
  target: [8, 0]
  dock_position: [0, 0]
  sensor_bias: 0.01
  payload_loaded: true
  payload_kg: 2.0
  payload_locked: true
  battery_pct: 24.0
  nearest_human_distance_m: 2.0
  current_subtask: navigate_to_dropoff
  fleet_context:
    nearby_robots: 0

steps:
  - step: cruise
    name: Cruise toward dropoff
    repeat: 5
    expected:
      final_move: east
      seom_passed: true
      audit_valid: true
      route_strategy: normal
      required_absent_violations: [C01_person_stop_300mm, C07_battery_return_15pct]

  - step: battery_warning
    name: Battery warning before abort
    observation_patch:
      battery_pct: 16.0
    expected:
      final_move: east
      seom_passed: true
      audit_valid: true
      route_strategy: normal

  - step: return_required
    name: Return required after drain
    observation_patch:
      battery_pct: 11.0
    expected:
      final_move: return_to_dock
      max_final_speed_mps: 0.3
      seom_passed: true
      audit_valid: true
      route_strategy: safe_halt_or_return
      expected_replan_reasons: [battery_abort]
      expected_recovery_actions: [return_to_dock, notify_operator]
      expected_grpo_risk_flags: [low_battery]

  - step: return_blocked_by_human
    name: Return path blocked by human
    observation_patch:
      battery_pct: 10.0
      nearest_human_distance_m: 0.2
    expected:
      final_move: hold
      final_speed_mps: 0.0
      seom_passed: false
      audit_valid: true
      route_strategy: safe_halt_or_return
      expected_violations: [C01_person_stop_300mm]
      expected_life_safety_violations: [C01_person_stop_300mm]
      expected_replan_reasons: [battery_abort]
      expected_grpo_risk_flags: [low_battery]

  - step: return_resumed
    name: Return resumes after path clears
    observation_patch:
      battery_pct: 9.0
      nearest_human_distance_m: 2.0
    expected:
      final_move: return_to_dock
      max_final_speed_mps: 0.3
      seom_passed: true
      audit_valid: true
      route_strategy: safe_halt_or_return
      expected_replan_reasons: [battery_abort]
      expected_grpo_risk_flags: [low_battery]

expected:
  final_move: return_to_dock
  seom_passed: true
  audit_valid: true
  route_strategy: safe_halt_or_return
  final_battery_pct: 9.0
  min_mission_elapsed_s: 240
  expected_replan_reasons: [battery_abort]
