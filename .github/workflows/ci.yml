# 中文：GitHub Actions CI，自动运行 lint、测试、场景质量门、benchmark 和审计校验，并上传质量产物。
# English: GitHub Actions CI running lint, tests, scenario gates, benchmarks, audit verification, and quality artifact upload.

name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality Gates
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONPATH: src

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            uv.lock

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Prepare artifact directories
        run: mkdir -p artifacts/reports artifacts/events artifacts/audit

      - name: Lint
        run: make lint PYTHON=python

      - name: Test
        run: python -m pytest --junitxml=artifacts/reports/pytest.xml

      - name: Run scenario quality gate
        run: make scenario PYTHON=python

      - name: Run latency benchmark quality gate
        run: make benchmark PYTHON=python

      - name: Verify audit chain
        run: make audit-verify PYTHON=python

      - name: Upload quality artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: origami-quality-artifacts-${{ github.run_attempt }}
          path: |
            artifacts/reports/**
            artifacts/events/**
            artifacts/audit/**
          if-no-files-found: warn
          retention-days: 14
