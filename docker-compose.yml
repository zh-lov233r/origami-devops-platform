# 中文：本地服务编排配置，用于启动 API 控制面、Prometheus 和 Grafana 观测服务。
# English: Local service orchestration for the API control plane, Prometheus, and Grafana observability services.

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: origami-devops-platform-api:local
    init: true
    working_dir: /workspace
    command: ["python", "-m", "origami.api.app"]
    environment:
      PYTHONPATH: /workspace/src
      ORIGAMI_ENV: ${ORIGAMI_ENV:-local}
      ORIGAMI_ARTIFACT_ROOT: /workspace/artifacts
      ORIGAMI_AUTH_REQUIRED: ${ORIGAMI_AUTH_REQUIRED:-false}
      ORIGAMI_API_TOKEN: ${ORIGAMI_API_TOKEN:-}
      ORIGAMI_GRAFANA_URL: ${ORIGAMI_GRAFANA_URL:-http://127.0.0.1:3000/d/origami-overview?orgId=1}
      ORIGAMI_LOG_LEVEL: ${ORIGAMI_LOG_LEVEL:-INFO}
      ORIGAMI_ALLOWED_ORIGINS: ${ORIGAMI_ALLOWED_ORIGINS:-}
      ORIGAMI_TRUSTED_HOSTS: ${ORIGAMI_TRUSTED_HOSTS:-}
      ORIGAMI_ACTOR_HEADER: ${ORIGAMI_ACTOR_HEADER:-X-Origami-Actor}
    ports:
      - "8000:8000"
    volumes:
      - .:/workspace
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=2).read()",
        ]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 30s

  prometheus:
    image: prom/prometheus:latest
    depends_on:
      api:
        condition: service_healthy
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
      - --web.console.libraries=/usr/share/prometheus/console_libraries
      - --web.console.templates=/usr/share/prometheus/consoles
    ports:
      - "9090:9090"
    volumes:
      - ./configs/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./configs/observability/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus

  grafana:
    image: grafana/grafana:latest
    depends_on:
      prometheus:
        condition: service_started
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/origami-overview.json
      GF_SECURITY_ALLOW_EMBEDDING: "true"
      GF_SERVER_ROOT_URL: http://127.0.0.1:3000
      GF_USERS_DEFAULT_THEME: light
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./configs/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./configs/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro

volumes:
  prometheus-data:
  grafana-data:
